<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juego: ¡Atrapa los Cuadrados!</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .contenedor-juego {
            width: 90%;
            max-width: 800px;
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
        }

        .controles {
            display: flex;
            justify-content: space-around;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .info {
            background: #f0f0f0;
            padding: 10px 20px;
            border-radius: 8px;
            text-align: center;
            font-weight: bold;
            color: #333;
        }

        button {
            padding: 12px 30px;
            font-size: 16px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: bold;
        }

        button:hover {
            background: #764ba2;
            transform: scale(1.05);
        }

        button:active {
            transform: scale(0.95);
        }

        #areajuego {
            width: 100%;
            height: 500px;
            background: linear-gradient(to bottom, #e0e7ff, #f3f0ff);
            border: 3px solid #667eea;
            border-radius: 10px;
            position: relative;
            overflow: hidden;
            cursor: crosshair;
            margin-bottom: 20px;
        }

        .cuadrado {
            position: absolute;
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-weight: bold;
            font-size: 24px;
            transition: transform 0.1s;
            user-select: none;
            box-shadow: 0 4px 15px rgba(245, 87, 108, 0.4);
        }

        .cuadrado:hover {
            transform: scale(1.1);
        }

        .cuadrado.golpeado {
            animation: explosion 0.3s ease-out;
        }

        @keyframes explosion {
            0% {
                transform: scale(1);
                opacity: 1;
            }
            100% {
                transform: scale(1.5);
                opacity: 0;
            }
        }

        .mensaje {
            text-align: center;
            font-size: 18px;
            color: #667eea;
            font-weight: bold;
            margin-top: 20px;
            min-height: 25px;
        }

        .game-over {
            background: #ff6b6b;
            color: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            margin-top: 20px;
        }

        .game-over h2 {
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="contenedor-juego">
        <h1>🎮 ¡Atrapa los Cuadrados!</h1>
        
        <div class="controles">
            <div class="info">Puntuación: <span id="puntuacion">0</span></div>
            <button id="botonInicio">Iniciar Juego</button>
            <button id="botonReinicio">Reiniciar</button>
            <div class="info">Tiempo: <span id="tiempo">30</span>s</div>
        </div>

        <div id="areajuego"></div>

        <div class="mensaje" id="mensaje">
            Haz clic en "Iniciar Juego" para comenzar
        </div>
    </div>

    <script>
        class JuegoAtrapasCuadrados {
            constructor() {
                this.puntuacion = 0;
                this.tiempo = 30;
                this.juegoActivo = false;
                this.cuadradoActual = null;
                this.tiempoIntervalo = null;
                this.intervaloCreacion = null;

                this.areajuego = document.getElementById('areajuego');
                this.botonInicio = document.getElementById('botonInicio');
                this.botonReinicio = document.getElementById('botonReinicio');
                this.elementoPuntuacion = document.getElementById('puntuacion');
                this.elementoTiempo = document.getElementById('tiempo');
                this.elementoMensaje = document.getElementById('mensaje');

                this.botonInicio.addEventListener('click', () => this.iniciar());
                this.botonReinicio.addEventListener('click', () => this.reiniciar());
            }

            iniciar() {
                this.juegoActivo = true;
                this.puntuacion = 0;
                this.tiempo = 30;
                this.elementoPuntuacion.textContent = '0';
                this.elementoTiempo.textContent = '30';
                this.elementoMensaje.textContent = '¡Juego iniciado! Atrapa los cuadrados';
                this.areajuego.innerHTML = '';
                this.botonInicio.disabled = true;

                this.crearCuadrado();
                this.intervaloCreacion = setInterval(() => this.crearCuadrado(), 800);

                this.tiempoIntervalo = setInterval(() => {
                    this.tiempo--;
                    this.elementoTiempo.textContent = this.tiempo;

                    if (this.tiempo <= 0) {
                        this.terminarJuego();
                    }
                }, 1000);
            }

            crearCuadrado() {
                if (!this.juegoActivo) return;

                if (this.cuadradoActual) {
                    this.cuadradoActual.remove();
                }

                const cuadrado = document.createElement('div');
                cuadrado.className = 'cuadrado';
                cuadrado.textContent = '✨';

                const ancho = this.areajuego.clientWidth - 50;
                const alto = this.areajuego.clientHeight - 50;

                const x = Math.random() * ancho;
                const y = Math.random() * alto;

                cuadrado.style.left = x + 'px';
                cuadrado.style.top = y + 'px';

                cuadrado.addEventListener('click', (e) => {
                    e.stopPropagation();
                    this.atraparcuadrado(cuadrado);
                });

                this.areajuego.appendChild(cuadrado);
                this.cuadradoActual = cuadrado;
            }

            atraparcuadrado(cuadrado) {
                if (!this.juegoActivo) return;

                cuadrado.classList.add('golpeado');
                this.puntuacion += 10;
                this.elementoPuntuacion.textContent = this.puntuacion;
                this.elementoMensaje.textContent = '¡Bien hecho! +10 puntos';

                setTimeout(() => {
                    if (this.juegoActivo) {
                        this.crearCuadrado();
                    }
                }, 200);
            }

            terminarJuego() {
                this.juegoActivo = false;
                clearInterval(this.tiempoIntervalo);
                clearInterval(this.intervaloCreacion);
                this.botonInicio.disabled = false;
                this.areajuego.innerHTML = `
                    <div class="game-over">
                        <h2>¡Juego Terminado!</h2>
                        <p>Puntuación Final: <strong>${this.puntuacion} puntos</strong></p>
                    </div>
                `;
                this.elementoMensaje.textContent = 'Haz clic en Reiniciar para jugar de nuevo';
            }

            reiniciar() {
                this.juegoActivo = false;
                clearInterval(this.tiempoIntervalo);
                clearInterval(this.intervaloCreacion);
                this.puntuacion = 0;
                this.tiempo = 30;
                this.elementoPuntuacion.textContent = '0';
                this.elementoTiempo.textContent = '30';
                this.elementoMensaje.textContent = 'Juego reiniciado. Haz clic en "Iniciar Juego"';
                this.areajuego.innerHTML = '';
                this.botonInicio.disabled = false;
            }
        }

        const juego = new JuegoAtrapasCuadrados();
    </script>
</body>
</html>
