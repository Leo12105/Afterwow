<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dr Cell - Juego Futurista</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 50%, #0f1b2e 100%);
            color: #e0e0e0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
            max-width: 900px;
            width: 100%;
        }

        .title {
            font-size: 48px;
            font-weight: bold;
            background: linear-gradient(45deg, #00ff96, #00bfff, #ff00ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-align: center;
        }

        .subtitle {
            font-size: 18px;
            color: #a0a0a0;
            text-align: center;
        }

        #gameCanvas {
            border: 3px solid #00ff96;
            background: linear-gradient(180deg, #001a33 0%, #0a1f3a 100%);
            box-shadow: 0 0 30px rgba(0, 255, 150, 0.5);
            border-radius: 10px;
            display: block;
            max-width: 100%;
            height: auto;
        }

        .game-info {
            display: flex;
            justify-content: space-around;
            width: 100%;
            gap: 20px;
            flex-wrap: wrap;
        }

        .info-box {
            background: rgba(0, 255, 150, 0.1);
            border: 2px solid rgba(0, 255, 150, 0.3);
            padding: 20px 30px;
            border-radius: 10px;
            text-align: center;
            flex: 1;
            min-width: 150px;
        }

        .info-label {
            color: #a0a0a0;
            font-size: 14px;
            margin-bottom: 5px;
        }

        .info-value {
            color: #00ff96;
            font-size: 28px;
            font-weight: bold;
        }

        .controls {
            text-align: center;
            color: #a0a0a0;
        }

        .controls h3 {
            color: #00ff96;
            margin-bottom: 10px;
            font-size: 18px;
        }

        .controls p {
            margin: 5px 0;
            font-size: 16px;
        }

        .buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 20px;
        }

        button {
            padding: 12px 30px;
            font-size: 16px;
            font-weight: bold;
            border: 2px solid #00ff96;
            background: linear-gradient(45deg, #00ff96, #00bfff);
            color: #0a0e27;
            border-radius: 50px;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 0 15px rgba(0, 255, 150, 0.5);
        }

        button:hover {
            transform: scale(1.05);
            box-shadow: 0 0 30px rgba(0, 255, 150, 0.8);
        }

        button:active {
            transform: scale(0.98);
        }

        .game-over {
            text-align: center;
            color: #ff6b6b;
            font-size: 24px;
            font-weight: bold;
            margin-top: 20px;
            display: none;
        }

        .game-over.show {
            display: block;
            animation: pulse 0.5s;
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.1);
            }
        }

        @media (max-width: 768px) {
            .title {
                font-size: 32px;
            }

            .info-box {
                min-width: 120px;
                padding: 15px 20px;
            }

            .info-value {
                font-size: 20px;
            }

            #gameCanvas {
                max-width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1 class="title">🤖 Dr Cell - Space Runner</h1>
        <p class="subtitle">Pilota el robot y esquiva los asteroides</p>
        
        <canvas id="gameCanvas" width="800" height="500"></canvas>

        <div class="game-info">
            <div class="info-box">
                <div class="info-label">Puntuación</div>
                <div class="info-value" id="score">0</div>
            </div>
            <div class="info-box">
                <div class="info-label">Vidas</div>
                <div class="info-value" id="lives">3</div>
            </div>
            <div class="info-box">
                <div class="info-label">Nivel</div>
                <div class="info-value" id="level">1</div>
            </div>
        </div>

        <div class="controls">
            <h3>🎮 Controles</h3>
            <p><strong>Mouse/Táctil:</strong> Mueve el cursor para controlar el robot</p>
            <p><strong>O usa las flechas del teclado:</strong> ⬅️ Izquierda | ➡️ Derecha</p>
        </div>

        <div class="buttons">
            <button id="startBtn" onclick="startGame()">Iniciar Juego</button>
            <button id="pauseBtn" onclick="togglePause()" style="display:none;">Pausar</button>
            <button id="resumeBtn" onclick="togglePause()" style="display:none;">Reanudar</button>
            <button onclick="resetGame()">Reiniciar</button>
        </div>

        <div class="game-over" id="gameOverMsg"></div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Variables del juego
        let gameRunning = false;
        let gamePaused = false;
        let score = 0;
        let lives = 3;
        let level = 1;
        let frameCount = 0;

        // Robot (jugador)
        const robot = {
            x: canvas.width / 2,
            y: canvas.height - 60,
            width: 40,
            height: 50,
            speed: 5,
            dx: 0
        };

        // Asteroides
        let asteroids = [];
        let asteroidSpeed = 3;

        // Teclado
        const keys = {};
        window.addEventListener('keydown', (e) => {
            keys[e.key] = true;
        });
        window.addEventListener('keyup', (e) => {
            keys[e.key] = false;
        });

        // Mouse
        document.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            robot.x = Math.max(0, Math.min(canvas.width - robot.width, mouseX - robot.width / 2));
        });

        // Touch
        document.addEventListener('touchmove', (e) => {
            const rect = canvas.getBoundingClientRect();
            const touchX = e.touches[0].clientX - rect.left;
            robot.x = Math.max(0, Math.min(canvas.width - robot.width, touchX - robot.width / 2));
        }, { passive: true });

        // Crear asteroide
        function createAsteroid() {
            const width = 30 + Math.random() * 20;
            const height = width;
            const x = Math.random() * (canvas.width - width);
            asteroids.push({
                x: x,
                y: -height,
                width: width,
                height: height,
                speed: asteroidSpeed
            });
        }

        // Dibujar robot
        function drawRobot() {
            // Cuerpo
            ctx.fillStyle = '#2a4d7c';
            ctx.fillRect(robot.x, robot.y, robot.width, robot.height);
            
            // Borde
            ctx.strokeStyle = '#00ff96';
            ctx.lineWidth = 2;
            ctx.strokeRect(robot.x, robot.y, robot.width, robot.height);

            // Cabeza
            ctx.fillStyle = '#1a3a5c';
            ctx.fillRect(robot.x + 8, robot.y - 10, 24, 15);
            
            // Ojos
            ctx.fillStyle = '#ffff00';
            ctx.beginPath();
            ctx.arc(robot.x + 14, robot.y - 5, 3, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(robot.x + 26, robot.y - 5, 3, 0, Math.PI * 2);
            ctx.fill();

            // Brazos
            ctx.fillStyle = '#00bfff';
            ctx.fillRect(robot.x - 10, robot.y + 10, 10, 8);
            ctx.fillRect(robot.x + robot.width, robot.y + 10, 10, 8);
        }

        // Dibujar asteroide
        function drawAsteroid(asteroid) {
            ctx.fillStyle = '#ff6b6b';
            ctx.beginPath();
            ctx.arc(asteroid.x + asteroid.width / 2, asteroid.y + asteroid.height / 2, asteroid.width / 2, 0, Math.PI * 2);
            ctx.fill();

            ctx.strokeStyle = '#ff00ff';
            ctx.lineWidth = 2;
            ctx.stroke();
        }

        // Colisión
        function checkCollision(rect1, rect2) {
            return rect1.x < rect2.x + rect2.width &&
                   rect1.x + rect1.width > rect2.x &&
                   rect1.y < rect2.y + rect2.height &&
                   rect1.y + rect1.height > rect2.y;
        }

        // Actualizar juego
        function update() {
            if (!gameRunning || gamePaused) return;

            frameCount++;

            // Movimiento del robot con teclado
            if (keys['ArrowLeft']) {
                robot.x = Math.max(0, robot.x - robot.speed);
            }
            if (keys['ArrowRight']) {
                robot.x = Math.min(canvas.width - robot.width, robot.x + robot.speed);
            }

            // Crear asteroides
            if (frameCount % (80 - level * 5) === 0) {
                createAsteroid();
            }

            // Actualizar asteroides
            for (let i = asteroids.length - 1; i >= 0; i--) {
                asteroids[i].y += asteroids[i].speed;

                // Colisión
                if (checkCollision(robot, asteroids[i])) {
                    lives--;
                    asteroids.splice(i, 1);
                    if (lives <= 0) {
                        endGame();
                    }
                    continue;
                }

                // Asteroide fuera de pantalla
                if (asteroids[i].y > canvas.height) {
                    score += 10;
                    asteroids.splice(i, 1);
                }
            }

            // Aumentar dificultad
            if (score > 0 && score % 200 === 0) {
                level = Math.floor(score / 200) + 1;
                asteroidSpeed = 3 + level * 0.5;
            }
        }

        // Dibujar
        function draw() {
            // Fondo
            ctx.fillStyle = 'rgba(10, 14, 39, 0.1)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Efecto de estrellas
            ctx.fillStyle = '#ffffff';
            ctx.globalAlpha = 0.3;
            for (let i = 0; i < 20; i++) {
                const x = (frameCount * 0.5 + i * 40) % canvas.width;
                const y = (i * 25) % canvas.height;
                ctx.fillRect(x, y, 2, 2);
            }
            ctx.globalAlpha = 1;

            // Dibujar robot y asteroides
            drawRobot();
            asteroids.forEach(asteroid => drawAsteroid(asteroid));

            // Texto de pausa
            if (gamePaused) {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#ffff00';
                ctx.font = 'bold 40px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('PAUSADO', canvas.width / 2, canvas.height / 2);
            }
        }

        // Loop del juego
        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        // Iniciar juego
        function startGame() {
            gameRunning = true;
            gamePaused = false;
            document.getElementById('startBtn').style.display = 'none';
            document.getElementById('pauseBtn').style.display = 'inline-block';
            document.getElementById('gameOverMsg').classList.remove('show');
        }

        // Pausar/Reanudar
        function togglePause() {
            gamePaused = !gamePaused;
            document.getElementById('pauseBtn').style.display = gamePaused ? 'none' : 'inline-block';
            document.getElementById('resumeBtn').style.display = gamePaused ? 'inline-block' : 'none';
        }

        // Fin del juego
        function endGame() {
            gameRunning = false;
            document.getElementById('pauseBtn').style.display = 'none';
            document.getElementById('resumeBtn').style.display = 'none';
            document.getElementById('startBtn').style.display = 'inline-block';
            const gameOverMsg = document.getElementById('gameOverMsg');
            gameOverMsg.textContent = `¡GAME OVER! Puntuación Final: ${score}`;
            gameOverMsg.classList.add('show');
        }

        // Reiniciar juego
        function resetGame() {
            gameRunning = false;
            gamePaused = false;
            score = 0;
            lives = 3;
            level = 1;
            frameCount = 0;
            asteroids = [];
            asteroidSpeed = 3;
            robot.x = canvas.width / 2;

            document.getElementById('score').textContent = score;
            document.getElementById('lives').textContent = lives;
            document.getElementById('level').textContent = level;
            document.getElementById('startBtn').style.display = 'inline-block';
            document.getElementById('pauseBtn').style.display = 'none';
            document.getElementById('resumeBtn').style.display = 'none';
            document.getElementById('gameOverMsg').classList.remove('show');
        }

        // Actualizar puntuación en pantalla
        function updateUI() {
            document.getElementById('score').textContent = score;
            document.getElementById('lives').textContent = lives;
            document
