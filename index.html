<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dr Cell - Reparación de Teléfonos del Futuro</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Roboto', sans-serif;
            background: #0a0e27;
            color: #e0e0e0;
            overflow-x: hidden;
        }

        /* Estilos Globales */
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* Animaciones Globales */
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(20px); }
        }

        @keyframes glow {
            0%, 100% { text-shadow: 0 0 10px #00ff88, 0 0 20px #00ff88; }
            50% { text-shadow: 0 0 20px #00ff88, 0 0 40px #00ff88, 0 0 60px #00ff88; }
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @keyframes slideInDown {
            from {
                opacity: 0;
                transform: translateY(-50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideInUp {
            from {
                opacity: 0;
                transform: translateY(50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; }
        }

        @keyframes neon-flicker {
            0%, 18%, 22%, 25%, 54%, 56%, 100% {
                text-shadow: 0 0 10px #00ff88, 0 0 20px #00ff88, 0 0 40px #00ff88;
                color: #00ff88;
            }
            20%, 24%, 55% {
                text-shadow: none;
                color: rgba(0, 255, 136, 0.3);
            }
        }

        @keyframes scan-line {
            0% { transform: translateY(-100%); }
            100% { transform: translateY(100%); }
        }

        @keyframes particles {
            0% {
                opacity: 1;
                transform: translate(0, 0);
            }
            100% {
                opacity: 0;
                transform: translate(var(--tx), var(--ty));
            }
        }

        /* Header */
        header {
            background: linear-gradient(135deg, rgba(10, 14, 39, 0.95), rgba(20, 25, 50, 0.95));
            padding: 1.5rem 0;
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 1000;
            border-bottom: 2px solid #00ff88;
            box-shadow: 0 0 30px rgba(0, 255, 136, 0.3);
            backdrop-filter: blur(10px);
        }

        header .container {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.5rem;
            font-weight: 900;
            background: linear-gradient(135deg, #00ff88, #00ffff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: glow 2s ease-in-out infinite;
            letter-spacing: 3px;
        }

        nav a {
            color: #e0e0e0;
            text-decoration: none;
            margin-left: 2rem;
            font-weight: 500;
            position: relative;
            transition: color 0.3s ease;
        }

        nav a::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 0;
            width: 0;
            height: 2px;
            background: linear-gradient(90deg, #00ff88, #00ffff);
            transition: width 0.3s ease;
        }

        nav a:hover::after {
            width: 100%;
        }

        /* Hero Section */
        .hero {
            margin-top: 80px;
            height: 100vh;
            background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 50%, #0f1428 100%);
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .hero::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                linear-gradient(90deg, transparent 0%, rgba(0, 255, 136, 0.1) 50%, transparent 100%);
            animation: scan-line 3s linear infinite;
            pointer-events: none;
        }

        .hero-content {
            position: relative;
            z-index: 2;
            animation: slideInDown 1s ease-out;
        }

        .hero h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 5rem;
            font-weight: 900;
            margin-bottom: 1rem;
            letter-spacing: 2px;
            animation: neon-flicker 3s infinite;
        }

        .hero p {
            font-size: 1.5rem;
            margin-bottom: 2rem;
            color: #00ffff;
            animation: slideInUp 1s ease-out 0.2s both;
            font-weight: 300;
        }

        .cta-button {
            display: inline-block;
            padding: 18px 50px;
            font-size: 1.2rem;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            color: #0a0e27;
            background: linear-gradient(135deg, #00ff88, #00ffff);
            border: none;
            border-radius: 50px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            animation: slideInUp 1s ease-out 0.4s both;
            transition: all 0.3s ease;
            letter-spacing: 1px;
        }

        .cta-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s ease;
        }

        .cta-button:hover::before {
            left: 100%;
        }

        .cta-button:hover {
            box-shadow: 0 0 30px rgba(0, 255, 136, 0.6);
            transform: scale(1.05);
        }

        /* Sección Flotante */
        .floating-phone {
            position: absolute;
            right: 10%;
            top: 50%;
            transform: translateY(-50%);
            width: 300px;
            height: 400px;
            background: linear-gradient(135deg, #00ff88, #00ffff);
            padding: 10px;
            border-radius: 40px;
            box-shadow: 0 0 50px rgba(0, 255, 136, 0.4);
            animation: float 3s ease-in-out infinite;
            display: none;
        }

        .floating-phone::before {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 150px;
            height: 25px;
            background: #0a0e27;
            border-radius: 0 0 20px 20px;
            z-index: 1;
        }

        .floating-phone .screen {
            width: 100%;
            height: 100%;
            background: #0a0e27;
            border-radius: 35px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
        }

        @media (min-width: 1200px) {
            .floating-phone {
                display: block;
            }
        }

        /* Servicios */
        .servicios {
            padding: 100px 0;
            position: relative;
            background: linear-gradient(180deg, #0a0e27 0%, #1a1f3a 100%);
        }

        .section-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 3.5rem;
            text-align: center;
            margin-bottom: 5rem;
            color: #00ff88;
            animation: glow 2s ease-in-out infinite;
            letter-spacing: 2px;
        }

        .servicios-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
            perspective: 1000px;
        }

        .servicio-card {
            background: linear-gradient(135deg, rgba(0, 255, 136, 0.05), rgba(0, 255, 255, 0.05));
            border: 2px solid rgba(0, 255, 136, 0.3);
            padding: 2.5rem;
            border-radius: 20px;
            position: relative;
            overflow: hidden;
            transition: all 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            cursor: pointer;
            animation: slideInUp 0.8s ease-out;
        }

        .servicio-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(135deg, transparent, rgba(0, 255, 136, 0.2), transparent);
            transform: rotate(45deg);
            animation: rotate 20s linear infinite;
        }

        .servicio-card:hover {
            border-color: #00ff88;
            box-shadow: 0 0 40px rgba(0, 255, 136, 0.5);
            transform: translateY(-20px) rotateX(5deg);
            background: linear-gradient(135deg, rgba(0, 255, 136, 0.1), rgba(0, 255, 255, 0.1));
        }

        .servicio-icon {
            font-size: 3.5rem;
            margin-bottom: 1rem;
            animation: float 3s ease-in-out infinite;
            position: relative;
            z-index: 1;
        }

        .servicio-card h3 {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.5rem;
            margin-bottom: 1rem;
            color: #00ffff;
            position: relative;
            z-index: 1;
        }

        .servicio-card p {
            color: #b0b0b0;
            position: relative;
            z-index: 1;
            line-height: 1.6;
        }

        /* Características */
        .caracteristicas {
            padding: 100px 0;
            background: linear-gradient(180deg, #1a1f3a 0%, #0a0e27 100%);
        }

        .caracteristicas-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 3rem;
        }

        .caracteristica {
            text-align: center;
            animation: slideInUp 0.8s ease-out;
        }

        .caracteristica-numero {
            font-family: 'Orbitron', sans-serif;
            font-size: 3.5rem;
            color: #00ff88;
            font-weight: 900;
            margin-bottom: 0.5rem;
            animation: glow 2s ease-in-out infinite;
        }

        .caracteristica h4 {
            font-family: 'Orbitron', sans-serif;
            color: #00ffff;
            margin-bottom: 0.5rem;
            font-size: 1.3rem;
        }

        /* Contacto */
        .contacto {
            padding: 100px 0;
            background: linear-gradient(135deg, #0a0e27, #1a1f3a, #0a0e27);
            position: relative;
        }

        .contacto::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: radial-gradient(circle at 20% 50%, rgba(0, 255, 136, 0.1), transparent 50%),
                        radial-gradient(circle at 80% 80%, rgba(0, 255, 255, 0.1), transparent 50%);
            pointer-events: none;
        }

        .contacto-content {
            position: relative;
            z-index: 1;
            text-align: center;
        }

        .contacto-info {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 2rem;
            margin-top: 3rem;
        }

        .info-item {
            background: linear-gradient(135deg, rgba(0, 255, 136, 0.05), rgba(0, 255, 255, 0.05));
            border: 2px solid rgba(0, 255, 136, 0.3);
            padding: 2rem;
            border-radius: 15px;
            transition: all 0.4s ease;
            animation: slideInUp 0.8s ease-out;
        }

        .info-item:hover {
            border-color: #00ff88;
            box-shadow: 0 0 30px rgba(0, 255, 136, 0.4);
            transform: translateY(-10px);
        }

        .info-icon {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            animation: float 3s ease-in-out infinite;
        }

        .info-item h4 {
            font-family: 'Orbitron', sans-serif;
            color: #00ffff;
            margin-bottom: 0.5rem;
            font-size: 1.2rem;
        }

        .info-item p {
            color: #b0b0b0;
        }

        /* Footer */
        footer {
            background: #050810;
            padding: 2rem 0;
            text-align: center;
            border-top: 2px solid #00ff88;
            color: #666;
        }
