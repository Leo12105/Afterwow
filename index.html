<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dr Cell - Reparación Futurista</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Roboto', sans-serif;
            background: #0a0e27;
            color: #e0e0e0;
            overflow-x: hidden;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* ===== ANIMACIONES ===== */
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(30px); }
        }

        @keyframes glow {
            0%, 100% { text-shadow: 0 0 10px #00ff88, 0 0 20px #00ff88, 0 0 30px #00ff88; }
            50% { text-shadow: 0 0 20px #00ff88, 0 0 40px #00ff88, 0 0 60px #00ff88, 0 0 80px #00ff88; }
        }

        @keyframes slideInDown {
            from {
                opacity: 0;
                transform: translateY(-50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideInUp {
            from {
                opacity: 0;
                transform: translateY(50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes scan-line {
            0% { transform: translateY(-100%); }
            100% { transform: translateY(100%); }
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @keyframes pulse-glow {
            0%, 100% { box-shadow: 0 0 20px rgba(0, 255, 136, 0.5), inset 0 0 20px rgba(0, 255, 136, 0.2); }
            50% { box-shadow: 0 0 40px rgba(0, 255, 136, 0.8), inset 0 0 40px rgba(0, 255, 136, 0.4); }
        }

        @keyframes particle-float {
            0% {
                opacity: 1;
                transform: translate(0, 0) scale(1);
            }
            100% {
                opacity: 0;
                transform: translate(var(--tx), var(--ty)) scale(0);
            }
        }

        @keyframes hologram {
            0%, 100% {
                opacity: 0.8;
                transform: translateZ(0);
            }
            50% {
                opacity: 1;
                transform: translateZ(10px);
            }
        }

        @keyframes cyber-flicker {
            0%, 100% {
                color: #00ff88;
                text-shadow: 0 0 10px #00ff88;
            }
            50% {
                color: #00ffff;
                text-shadow: 0 0 20px #00ffff;
            }
        }

        /* ===== HEADER ===== */
        header {
            background: linear-gradient(135deg, rgba(10, 14, 39, 0.98), rgba(20, 25, 50, 0.98));
            padding: 1.5rem 0;
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 1000;
            border-bottom: 3px solid #00ff88;
            box-shadow: 0 0 50px rgba(0, 255, 136, 0.4);
            backdrop-filter: blur(20px);
        }

        header .container {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.5rem;
            font-weight: 900;
            background: linear-gradient(135deg, #00ff88, #00ffff, #ff00ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: glow 3s ease-in-out infinite;
            letter-spacing: 4px;
        }

        nav {
            display: flex;
            gap: 2rem;
        }

        nav a {
            color: #e0e0e0;
            text-decoration: none;
            font-weight: 500;
            position: relative;
            transition: all 0.3s ease;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.95rem;
            letter-spacing: 1px;
        }

        nav a::before {
            content: '';
            position: absolute;
            bottom: -8px;
            left: 0;
            width: 0;
            height: 2px;
            background: linear-gradient(90deg, #00ff88, #00ffff);
            transition: width 0.4s ease;
            box-shadow: 0 0 10px rgba(0, 255, 136, 0.6);
        }

        nav a:hover::before {
            width: 100%;
        }

        nav a:hover {
            color: #00ff88;
            text-shadow: 0 0 10px rgba(0, 255, 136, 0.8);
        }

        /* ===== HERO SECTION ===== */
        .hero {
            margin-top: 80px;
            min-height: 100vh;
            background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 50%, #0f1428 100%);
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 60px 0;
        }

        .hero::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(90deg, transparent 0%, rgba(0, 255, 136, 0.08) 50%, transparent 100%);
            animation: scan-line 4s linear infinite;
            pointer-events: none;
        }

        .hero-left {
            position: relative;
            z-index: 2;
            flex: 1;
            animation: slideInDown 1s ease-out;
        }

        .hero h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 4.5rem;
            font-weight: 900;
            margin-bottom: 1rem;
            letter-spacing: 3px;
            animation: cyber-flicker 2s ease-in-out infinite;
            line-height: 1.2;
        }

        .hero-subtitle {
            font-size: 1.3rem;
            color: #00ffff;
            margin-bottom: 1rem;
            animation: slideInUp 1s ease-out 0.2s both;
            font-weight: 300;
            letter-spacing: 2px;
        }

        .hero-description {
            font-size: 1.1rem;
            color: #b0b0b0;
            margin-bottom: 3rem;
            animation: slideInUp 1s ease-out 0.4s both;
            max-width: 500px;
            line-height: 1.8;
        }

        .cta-button {
            display: inline-block;
            padding: 20px 60px;
            font-size: 1.1rem;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            color: #0a0e27;
            background: linear-gradient(135deg, #00ff88, #00ffff);
            border: none;
            border-radius: 60px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            animation: slideInUp 1s ease-out 0.6s both;
            transition: all 0.4s ease;
            letter-spacing: 2px;
            box-shadow: 0 0 30px rgba(0, 255, 136, 0.5);
        }

        .cta-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transition: left 0.6s ease;
        }

        .cta-button:hover::before {
            left: 100%;
        }

        .cta-button:hover {
            box-shadow: 0 0 50px rgba(0, 255, 136, 0.8);
            transform: scale(1.1);
            letter-spacing: 3px;
        }

        .cta-button:active {
            transform: scale(0.95);
        }

        /* ===== TELÉFONO 3D INTERACTIVO ===== */
        .hero-right {
            position: relative;
            z-index: 3;
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 600px;
            perspective: 1200px;
        }

        .phone-container {
            position: relative;
            width: 300px;
            height: 600px;
            transform-style: preserve-3d;
            animation: float 4s ease-in-out infinite;
        }

        .phone-container:hover {
            animation: none;
        }

        .phone {
            position: relative;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            border-radius: 50px;
            padding: 15px;
            box-shadow: 
                0 0 60px rgba(0, 255, 136, 0.6),
                0 0 100px rgba(0, 255, 255, 0.3),
                inset 0 0 30px rgba(0, 255, 136, 0.1);
            border: 3px solid #00ff88;
            overflow: hidden;
            animation: pulse-glow 2s ease-in-out infinite;
        }

        .phone::before {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 40%;
            height: 30px;
            background: #0a0e27;
            border-radius: 0 0 30px 30px;
            z-index: 10;
        }

        .phone-screen {
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #0a0e27, #1a1f3a);
            border-radius: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        .phone-screen::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(90deg, transparent 0%, rgba(0, 255, 136, 0.05) 50%, transparent 100%);
            animation: scan-line 3s linear infinite;
            pointer-events: none;
        }

        .phone-content {
            position: relative;
            z-index: 5;
            text-align: center;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .phone-icon {
            font-size: 5rem;
            margin-bottom: 20px;
            animation: float 3s ease-in-out infinite;
            filter: drop-shadow(0 0 20px rgba(0, 255, 136, 0.6));
        }

        .phone-text {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.5rem;
            color: #00ff88;
            text-shadow: 0 0 15px rgba(0, 255, 136, 0.8);
            animation: glow 2s ease-in-out infinite;
            letter-spacing: 2px;
        }

        .phone-sub-text {
            font-size: 0.9rem;
            color: #00ffff;
            margin-top: 10px;
            animation: cyber-flicker 3s ease-in-out infinite;
        }

        /* Efecto de brillo en el teléfono */
        .phone-shine {
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent 30%, rgba(255, 255, 255, 0.1) 50%, transparent 70%);
            animation: rotate 6s linear infinite;
            pointer-events: none;
        }

        /* ===== SERVICIOS ===== */
        .servicios {
            padding: 120px 0;
            position: relative;
            background: linear-gradient(180deg, #0a0e27 0%, #1a1f3a 50%, #0a0e27 100%);
        }

        .servicios::before {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            height: 1px;
            background: linear-gradient(90deg, transparent, #00ff88, transparent);
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.5);
        }

        .section-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 3.5rem;
            text-align: center;
            margin-bottom: 5rem;
            color: #00ff88;
            animation: glow 3s ease-in-out infinite;
            letter-spacing: 3px;
        }

        .servicios-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 2.5rem;
        }

        .servicio-card {
            background: linear-gradient(135deg, rgba(0, 255, 136, 0.05), rgba(0, 255, 255, 0.05));
            border: 2px solid rgba(0, 255, 136, 0.4);
            padding: 3rem;
            border-radius: 25px;
            position: relative;
            overflow: hidden;
            transition: all 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
            cursor: pointer;
            animation: slideInUp 0.8s ease-out;
        }

        .servicio-card::before {
